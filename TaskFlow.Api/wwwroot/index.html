<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TaskFlow, agenda personal sencilla para organizar tareas.">
  <title>TaskFlow · Agenda personal</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="TaskFlow inicio"><span>TF</span> TaskFlow</a>
    <nav aria-label="Filtros principales">
      <button class="nav-item active" data-status="all">Todas <span id="nav-total">0</span></button>
      <button class="nav-item" data-status="pending">Pendientes <span id="nav-pending">0</span></button>
      <button class="nav-item" data-status="completed">Completadas <span id="nav-completed">0</span></button>
      <button class="nav-item" data-status="overdue">Vencidas <span id="nav-overdue">0</span></button>
    </nav>
    <p class="sidebar-note">Organiza tu día,<br>una tarea a la vez.</p>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">MI AGENDA</p>
        <h1>Hola, ¿qué harás hoy?</h1>
      </div>
      <div class="user-area"><span id="current-user"></span><button class="secondary" id="logout">Cerrar sesión</button><button class="primary" id="new-task">＋ Nueva tarea</button></div>
    </header>

    <section class="stats" aria-label="Resumen de tareas">
      <article><span class="stat-icon blue">✓</span><div><strong id="total">0</strong><p>Total</p></div></article>
      <article><span class="stat-icon amber">○</span><div><strong id="pending">0</strong><p>Pendientes</p></div></article>
      <article><span class="stat-icon green">✓</span><div><strong id="completed">0</strong><p>Completadas</p></div></article>
      <article><span class="stat-icon red">!</span><div><strong id="overdue">0</strong><p>Vencidas</p></div></article>
    </section>

    <section class="workspace">
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar tareas..." aria-label="Buscar tareas"></label>
        <select id="priority-filter" aria-label="Filtrar por prioridad">
          <option value="">Todas las prioridades</option>
          <option value="High">Alta</option><option value="Medium">Media</option><option value="Low">Baja</option>
        </select>
        <select id="sort" aria-label="Ordenar tareas">
          <option value="date">Fecha límite</option><option value="priority">Prioridad</option><option value="name">Nombre</option>
        </select>
      </div>
      <div class="section-heading"><div><h2 id="list-title">Todas las tareas</h2><p id="list-subtitle">Tu lista completa</p></div></div>
      <div id="task-list" class="task-list" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        <span>✓</span><h2>No hay tareas aquí</h2><p>Crea una tarea nueva y empieza a organizar tu día.</p>
        <button class="primary" id="empty-new">Crear mi primera tarea</button>
      </div>
    </section>
  </main>

  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-heading"><div><p class="eyebrow">DETALLES</p><h2 id="dialog-title">Nueva tarea</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div>
      <input type="hidden" id="task-id">
      <label>Título <span>*</span><input id="title" maxlength="100" required placeholder="Ej. Entregar proyecto"></label>
      <label>Descripción<textarea id="description" maxlength="500" rows="4" placeholder="Agrega detalles importantes..."></textarea></label>
      <div class="form-row">
        <label>Fecha límite<input id="due-time" type="datetime-local"></label>
        <label>Prioridad<select id="priority"><option value="Low">Baja</option><option value="Medium" selected>Media</option><option value="High">Alta</option></select></label>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar tarea</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js?v=20260801-time-fix"></script>
</body>
</html>
